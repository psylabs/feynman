<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Feynman</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">Feynman</div>
    <nav id="navlinks">
      <button class="navlink active" data-screen="screen-start">Home</button>
      <button class="navlink" data-screen="screen-profile">Profile</button>
      <button class="navlink" data-screen="screen-leaderboard">Leaderboard</button>
    </nav>
    <div id="user-picker">
      <button id="btn-user" class="user-button">Loading…</button>
      <div id="user-menu" class="user-menu hidden"></div>
    </div>
  </header>

  <main>
    <section id="screen-start" class="screen">
      <h1 id="greeting">Hi.</h1>
      <p id="start-blurb" class="muted">Voice-first mental math. Press &amp; hold the button (or spacebar) to answer.</p>
      <div id="eval-banner" class="banner hidden">
        Take a 20-question baseline first so the system can tell what to drill.
      </div>
      <div id="diagnosis-teaser" class="hidden"></div>
      <div class="actions row">
        <button id="btn-start-eval" class="primary">Take baseline (20q)</button>
        <button id="btn-start-drill" class="secondary">Start drill</button>
        <label class="muted" for="drill-length" style="margin-left:0.5rem;">Length</label>
        <select id="drill-length">
          <option value="5">5</option>
          <option value="8">8</option>
          <option value="12" selected>12</option>
          <option value="16">16</option>
          <option value="20">20</option>
          <option value="30">30</option>
        </select>
      </div>
    </section>

    <section id="screen-session" class="screen hidden">
      <div class="meta"><span id="position"></span><span id="mode-tag"></span></div>
      <div id="session-plan" class="session-plan hidden"></div>
      <div id="prompt"></div>
      <button id="btn-ptt" disabled>Press &amp; hold to answer</button>
      <div id="status"></div>
      <div id="result"></div>
      <div id="feedback"></div>
      <div class="actions row">
        <button id="btn-next" class="primary hidden">Next →</button>
        <button id="btn-end" class="secondary">End session</button>
      </div>
    </section>

    <section id="screen-review" class="screen hidden">
      <h2 id="review-title">Session review</h2>
      <div id="review"></div>
      <div class="actions row">
        <button id="btn-restart-drill" class="primary">Start drill</button>
        <button id="btn-restart-eval" class="secondary">Re-do baseline</button>
      </div>
    </section>

    <section id="screen-profile" class="screen hidden">
      <h2>Profile <span id="profile-user" class="muted"></span></h2>
      <div id="profile-content"></div>
    </section>

    <section id="screen-leaderboard" class="screen hidden">
      <h2>Leaderboard</h2>
      <div id="leaderboard-content"></div>
    </section>
  </main>

  <aside id="debug">
    <header>
      <h3>Debug</h3>
      <div class="dbg-actions">
        <span id="dbg-status" class="dbg-dot off"></span>
        <button id="btn-clear" class="tiny">clear</button>
      </div>
    </header>
    <div id="events"></div>
  </aside>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <script src="/debug.js"></script>
  <script src="/users.js"></script>
  <script src="/app.js"></script>
</body>
</html>
