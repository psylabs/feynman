- id: addition
  parent: arithmetic
  display_name: Addition
  target_latency_ms: 5000
  tolerance:
    type: exact
  parameter_schema:
    digit_range: [1, 3]
  templates:
    - "What is {a} plus {b}?"

- id: subtraction
  parent: arithmetic
  display_name: Subtraction
  target_latency_ms: 5000
  tolerance:
    type: exact
  parameter_schema:
    operand_range: [10, 99]
  templates:
    - "What is {a} minus {b}?"

- id: multiplication
  parent: arithmetic
  display_name: Multiplication
  target_latency_ms: 6000
  tolerance:
    type: exact
  parameter_schema:
    factor_range: [2, 12]
  templates:
    - "What is {a} times {b}?"

- id: percent_of
  parent: percentages
  display_name: Percent of a number
  target_latency_ms: 9000
  tolerance:
    type: money
  parameter_schema:
    percentages: [5, 10, 15, 18, 20, 25, 50]
  templates:
    - "What is {pct} percent of {base}?"

- id: money_arithmetic
  parent: grounded
  display_name: Money arithmetic
  target_latency_ms: 12000
  tolerance:
    type: money
  parameter_schema:
    operations: [charge_total, category_difference, category_share]
  templates:
    - "Use transaction data to answer this money question."
