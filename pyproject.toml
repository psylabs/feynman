[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feynman"
version = "0.0.1"
description = "Personal voice-first cognitive trainer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
docs = ["pdoc>=14"]

[tool.setuptools]
packages = ["server"]
