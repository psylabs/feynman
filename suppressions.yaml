# Active suppression rules per skill. Names must exist in
# server/suppressions.py REGISTRY.
#
# When you add or change rules here (or in the registry):
#   1. Also drop the newly-suppressed values from the generator's sampling
#      pools (server/generator.py) — leaving them in just burns the
#      suppression retry budget (see the multiplication L1 comment there).
#   2. Devices keep serving their cached offline seed packs, which were
#      generated under the OLD rules. Trigger a refresh for good measure:
#      tap "refresh pack" on the device (home screen), or wait for the
#      auto top-up. New rules apply to online prompts immediately.

addition:
  - single_digit_small
  - small_operand
  - by_ten

subtraction:
  - single_digit_small
  - trivial_diff
  - round_diff
  - subtract_zero
  - equal_operands
  - small_operand
  - by_ten

multiplication:
  - by_ten
  - trivial_value        # any operand or the product <= 5 or 10/11 (2026-07-04)

division:
  - trivial_value        # any of divisor/dividend/quotient <= 5 or 10/11 (2026-07-04)
  - ten_divisor          # /10, /20, ... are decimal shifts

weather_math:
  - trivial_diff
  - round_diff
