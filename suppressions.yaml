# Active suppression rules per skill. Names must exist in
# server/suppressions.py REGISTRY. The generator re-samples when a sampled
# problem matches any of these; pinned target facts bypass the check.
#
# To turn a rule off: comment it out or delete the line. To add a new rule
# *kind*, write a predicate in server/suppressions.py and reference it here.

addition:
  - single_digit_small

subtraction:
  - single_digit_small
  - trivial_diff      # |a - b| <= 2 (e.g. 9567 - 9566)
  - round_diff        # |a - b| in {5, 10, 50, 100, 200, 300, 400, 500, 1000}
  - subtract_zero
  - equal_operands

multiplication:
  - by_ten
