# Active suppression rules per skill. Entries are either a registered rule
# name (server/suppressions.py REGISTRY) or an inline comparator dict:
#   {feature: <name>, <cmp>: <value>}  — one of lte/gte/eq/in/require.
#
# Adding a rule is a yaml edit; samplers pre-check the active set
# automatically (Task 3). Only pools that ENUMERATE specific values (e.g. a
# fixed level-1 divisor list) still need manual pruning. Device seed packs
# stay stale until refreshed (tap "refresh pack", or wait for auto top-up).

addition:
  - {feature: max_operand, lte: 2}
  - {feature: min_operand, lte: 2}
  - by_ten
  - {feature: crosses_ten, require: true}

subtraction:
  - {feature: max_operand, lte: 2}
  - {feature: abs_diff, lte: 2}
  - {feature: abs_diff, in: [5, 10, 50, 100, 200, 300, 400, 500, 1000]}
  - {feature: min_operand, eq: 0}
  - {feature: abs_diff, eq: 0}
  - {feature: min_operand, lte: 2}
  - by_ten
  - {feature: crosses_ten, require: true}

multiplication:
  - by_ten
  - trivial_value        # any operand or the product <= 5 or 10/11 (2026-07-04)

division:
  - trivial_value        # any of divisor/dividend/quotient <= 5 or 10/11 (2026-07-04)
  - ten_divisor          # /10, /20, ... are decimal shifts

weather_math:
  - {feature: abs_diff, lte: 2}
  - {feature: abs_diff, in: [5, 10, 50, 100, 200, 300, 400, 500, 1000]}
