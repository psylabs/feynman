name: android-apk

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. Add the Mac mini ~/.android/debug.keystore as a repository secret so GitHub APKs can update local installs."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/debug.keystore"

      - name: Install npm dependencies
        run: npm ci

      - name: Write bundled build metadata
        run: node scripts/write-build-info.mjs

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/android-signing/debug.keystore
          ANDROID_DEBUG_KEYSTORE_PASSWORD: android
          ANDROID_DEBUG_KEY_ALIAS: androiddebugkey
          ANDROID_DEBUG_KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: feynman-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/intermediates/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
