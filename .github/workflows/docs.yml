name: docs

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/**"
      - "tools/render_docs.py"
      - "skills.yaml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pdoc and project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]
          pip install markdown

      - name: Build pdoc HTML
        run: |
          pdoc server \
            --output-directory site \
            --docformat google \
            --logo-link https://github.com/${{ github.repository }}

      - name: Render architecture page with Mermaid
        run: |
          python tools/render_docs.py \
            docs/architecture.md \
            site/architecture/index.html \
            --title "Feynman - Architecture"

      - name: Write landing page (overrides pdoc's auto-generated index)
        run: |
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Feynman docs</title>
            <style>
              :root { color-scheme: dark; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
                max-width: 600px;
                margin: 4rem auto;
                padding: 0 1.25rem;
                background: #0f1115;
                color: #d6d8de;
                line-height: 1.55;
              }
              a { color: #8ab4f8; }
              h1 { color: #f0f2f6; }
              .sub { color: #888; font-size: 0.92em; }
              ul { list-style: none; padding: 0; }
              li { padding: 0.75rem 0; border-bottom: 1px solid #1f2228; }
              li a { font-size: 1.05em; }
            </style>
          </head>
          <body>
            <h1>Feynman docs</h1>
            <p class="sub">Voice-first cognitive trainer. Built on every push to main.</p>
            <ul>
              <li>
                <a href="architecture/">Architecture</a><br>
                <span class="sub">Topology, turn lifecycle, components. Mermaid diagrams.</span>
              </li>
              <li>
                <a href="server.html">API reference (pdoc)</a><br>
                <span class="sub">Auto-generated from server/ docstrings.</span>
              </li>
              <li>
                <a href="https://github.com/psylabs/feynman">Source on GitHub</a>
              </li>
            </ul>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
