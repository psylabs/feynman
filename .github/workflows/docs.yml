name: docs

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/**"
      - "skills.yaml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pdoc and project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build pdoc HTML
        run: |
          pdoc server \
            --output-directory site \
            --docformat google \
            --logo-link https://github.com/${{ github.repository }}

      - name: Copy architecture docs alongside API reference
        run: |
          mkdir -p site/architecture
          cp docs/architecture.md site/architecture/index.md
          cp -r docs site/_source-docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
